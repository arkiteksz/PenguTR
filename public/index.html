<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguen Savaşları</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-stripes"></div>

<!-- İSİM EKRANI -->
<div id="screen-name" class="screen center-screen">
  <div class="name-box">
    <h1>🐧 Penguen Savaşları</h1>
    <input id="nameInput" type="text" placeholder="İsmini yaz..." maxlength="20" autocomplete="off">

    <div class="skin-picker">
      <div class="skin-label">Renk seç</div>
      <div class="skin-options">
        <button class="skin-btn active" data-skin="blue" style="--c:#3d6fb0">Mavi</button>
        <button class="skin-btn" data-skin="green" style="--c:#3d8f4a">Yeşil</button>
        <button class="skin-btn" data-skin="black" style="--c:#2a2a2a">Siyah</button>
        <button class="skin-btn" data-skin="purple" style="--c:#7a3d9e">Mor</button>
      </div>
    </div>

    <div class="hint">Enter'a bas ve devam et</div>
  </div>
</div>

<!-- ODA LİSTESİ -->
<div id="screen-roomlist" class="screen hidden">
  <div class="panel roomlist-panel">
    <div class="panel-header">
      <h2>Oda Listesi</h2>
      <div id="globalStats" class="global-stats">0 oyuncu, 0 oda</div>
    </div>

    <div class="roomlist-table-wrap">
      <table class="roomlist-table">
        <thead>
          <tr>
            <th>Oda Adı</th>
            <th>Oyuncu</th>
            <th>Şifre</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="roomListBody">
        </tbody>
      </table>
      <div id="roomListEmpty" class="empty-hint hidden">Şu an açık oda yok. Bir tane oluştur!</div>
    </div>

    <div class="roomlist-actions">
      <button id="btnRefresh" class="btn">↻ Yenile</button>
      <button id="btnCreateRoom" class="btn btn-primary">+ Oda Oluştur</button>
    </div>
  </div>
</div>

<!-- ODA OLUŞTUR MODAL -->
<div id="modal-create" class="modal-overlay hidden">
  <div class="modal">
    <h3>Oda Oluştur</h3>
    <label>Oda adı</label>
    <input id="createRoomName" type="text" maxlength="30" placeholder="Odanın adı">
    <label>Şifre (opsiyonel)</label>
    <input id="createRoomPassword" type="text" maxlength="20" placeholder="Boş bırakabilirsin">
    <label>Maksimum oyuncu</label>
    <input id="createRoomMax" type="number" min="2" max="30" value="12">
    <label class="checkbox-row">
      <input id="createRoomShow" type="checkbox" checked>
      Oda listesinde görünsün
    </label>
    <div class="modal-actions">
      <button id="btnCancelCreate" class="btn">Vazgeç</button>
      <button id="btnConfirmCreate" class="btn btn-primary">Oluştur</button>
    </div>
  </div>
</div>

<!-- ŞİFRE SOR MODAL -->
<div id="modal-password" class="modal-overlay hidden">
  <div class="modal">
    <h3>Bu oda şifreli</h3>
    <label>Şifre</label>
    <input id="joinRoomPassword" type="text" maxlength="20">
    <div class="modal-actions">
      <button id="btnCancelPassword" class="btn">Vazgeç</button>
      <button id="btnConfirmPassword" class="btn btn-primary">Katıl</button>
    </div>
  </div>
</div>

<!-- LOBİ / ODA EKRANI -->
<div id="screen-lobby" class="screen hidden">
  <div class="panel lobby-panel">
    <div class="panel-header">
      <h2 id="lobbyRoomName">Oda</h2>
      <div class="lobby-top-actions">
        <span id="lobbyRoomCode" class="room-code-badge"></span>
        <button id="btnLeaveRoom" class="btn">⏏ Ayrıl</button>
      </div>
    </div>

    <div class="teams-row">
      <div class="team-col team-red">
        <div class="team-header">Red <button id="btnToRed" class="arrow-btn">▶</button></div>
        <div id="teamRedList" class="team-list"></div>
      </div>
      <div class="team-col team-spectator">
        <div class="team-header">İzleyici</div>
        <div id="teamSpecList" class="team-list"></div>
      </div>
      <div class="team-col team-blue">
        <div class="team-header"><button id="btnToBlue" class="arrow-btn">◀</button> Blue</div>
        <div id="teamBlueList" class="team-list"></div>
      </div>
    </div>

    <div id="hostTools" class="host-tools hidden">
      <button class="btn" data-tool="auto">Auto</button>
      <button class="btn" data-tool="rand">Rand</button>
      <button class="btn" data-tool="lock">🔒 Lock</button>
      <button class="btn" data-tool="reset">Reset</button>
    </div>

    <div class="settings-row">
      <div class="setting-item">
        <label>Süre (dk)</label>
        <input id="settingTime" type="number" min="0" max="60" value="3">
      </div>
      <div class="setting-item">
        <label>Can (stok)</label>
        <input id="settingStock" type="number" min="1" max="20" value="3">
      </div>
      <div class="setting-item">
        <label>Harita</label>
        <select id="settingMap"></select>
      </div>
    </div>

    <button id="btnStartGame" class="btn btn-start hidden">▶ Oyunu Başlat</button>
    <div id="notHostHint" class="hint">Ayarları ve başlatmayı sadece oda sahibi yapabilir.</div>

    <div class="controls-legend">
      <strong>Kontroller:</strong> Hareket: A / D — Zıplama: W — Ateş: U
    </div>
  </div>
</div>

<!-- OYUN EKRANI (prototip) -->
<div id="screen-game" class="screen hidden game-screen">
  <div class="game-wrap">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>
</body>
</html>
